<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Celestial Kendama — Standalone 3D Previewer</title>
    <link rel="icon" href="data:," />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #2c2538;
        user-select: none;
      }
      #preview-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      /* Floating Header */
      .header-bar {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 12px 18px;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(44, 37, 56, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.9);
        display: flex;
        flex-direction: column;
        gap: 4px;
        pointer-events: auto;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .title-row h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.2px;
        background: linear-gradient(135deg, #7886c5 0%, #efb9d5 60%, #cdbbea 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .badge {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: #f0e8ff;
        color: #5d4b8b;
        padding: 2px 7px;
        border-radius: 6px;
      }
      .hud-stats {
        display: flex;
        gap: 14px;
        font-size: 11px;
        color: #6d6282;
      }
      .hud-stat span {
        font-weight: 600;
        color: #2c2538;
      }

      /* Control Sidebar */
      .sidebar {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 260px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        z-index: 10;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: 16px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(44, 37, 56, 0.10);
        border: 1px solid rgba(255, 255, 255, 0.9);
        display: flex;
        flex-direction: column;
        gap: 16px;
        pointer-events: auto;
      }
      .panel-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .section-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: #8a7c9f;
        margin: 0;
      }

      /* Buttons & Actions */
      .btn-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .btn {
        background: #ffffff;
        border: 1px solid #e2dcee;
        color: #3b324d;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn:hover {
        background: #f7f3ff;
        border-color: #cdbbea;
        color: #4b367d;
      }
      .btn:active {
        transform: scale(0.98);
      }

      /* Toggle Items */
      .toggle-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 500;
        color: #3a3248;
        padding: 5px 2px;
        cursor: pointer;
      }
      .toggle-label-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        border: 1px solid rgba(0,0,0,0.1);
      }
      .toggle-item input[type="checkbox"] {
        cursor: pointer;
        width: 16px;
        height: 16px;
        accent-color: #8b6bc9;
      }

      /* Background Selector */
      .theme-row {
        display: flex;
        gap: 6px;
      }
      .theme-btn {
        flex: 1;
        font-size: 11px;
        padding: 6px;
        border-radius: 6px;
        border: 1px solid #dfd8ed;
        background: #ffffff;
        color: #5a4f70;
        cursor: pointer;
        text-align: center;
        transition: all 0.15s;
      }
      .theme-btn:hover {
        background: #f7f4fc;
      }
      .theme-btn.active {
        background: #8b6bc9;
        color: #ffffff;
        border-color: #8b6bc9;
        font-weight: 600;
      }

      /* Footer Helper */
      .hint-box {
        font-size: 10px;
        line-height: 1.4;
        color: #7b718d;
        background: #f7f5fb;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px dashed #dcd5e8;
      }
    </style>
  </head>
  <body>
    <div id="preview-container"></div>

    <!-- Header HUD -->
    <div class="header-bar">
      <div class="title-row">
        <h1>Celestial Kendama</h1>
        <span class="badge">Desktop 3D Previewer</span>
      </div>
      <div class="hud-stats">
        <div class="hud-stat">Active Meshes: <span id="hud-active-count">7 / 7</span></div>
        <div class="hud-stat">Triangles: <span id="hud-tri-count">5,256</span></div>
        <div class="hud-stat">Shader: <span>3D Continuous Galaxy</span></div>
      </div>
    </div>

    <!-- Controls Sidebar -->
    <div class="sidebar">
      <!-- Camera Actions -->
      <div class="panel-section">
        <h2 class="section-title">Camera & View</h2>
        <div class="btn-row">
          <button id="btn-reset-cam" class="btn" title="Reset camera to default 3/4 elevated view">
            Reset View
          </button>
          <button id="btn-fit-model" class="btn" title="Fit all visible geometry into view">
            Fit Model
          </button>
        </div>
        <label class="toggle-item" style="margin-top: 4px;">
          <span>Auto Rotate</span>
          <input type="checkbox" id="toggle-auto-rotate" />
        </label>
      </div>

      <!-- Background Theme -->
      <div class="panel-section">
        <h2 class="section-title">Studio Backdrop</h2>
        <div class="theme-row">
          <button class="theme-btn active" data-bg="light">Light</button>
          <button class="theme-btn" data-bg="lavender">Lilac</button>
          <button class="theme-btn" data-bg="dark">Dark</button>
        </div>
      </div>

      <!-- Component Toggles -->
      <div class="panel-section">
        <h2 class="section-title">Components (Ken Assembly)</h2>
        <label class="toggle-item">
          <span class="toggle-label-wrap">
            <span class="swatch" style="background: #fff9fc;"></span>
            <span>Sarado / Crossbar</span>
          </span>
          <input type="checkbox" id="toggle-crossbar" checked />
        </label>

        <label class="toggle-item">
          <span class="toggle-label-wrap">
            <span class="swatch" style="background: #efb9d5;"></span>
            <span>Big Cup (Oozara)</span>
          </span>
          <input type="checkbox" id="toggle-big-cup" checked />
        </label>

        <label class="toggle-item">
          <span class="toggle-label-wrap">
            <span class="swatch" style="background: #cdbbea;"></span>
            <span>Small Cup (Kozara)</span>
          </span>
          <input type="checkbox" id="toggle-small-cup" checked />
        </label>

        <label class="toggle-item">
          <span class="toggle-label-wrap">
            <span class="swatch" style="background: #efb9d5;"></span>
            <span>Base Cup (Chuzara)</span>
          </span>
          <input type="checkbox" id="toggle-base-cup" checked />
        </label>

        <label class="toggle-item">
          <span class="toggle-label-wrap">
            <span class="swatch" style="background: #f7f0f5;"></span>
            <span>Spike (Kensaki)</span>
          </span>
          <input type="checkbox" id="toggle-spike" checked />
        </label>

        <label class="toggle-item">
          <span class="toggle-label-wrap">
            <span class="swatch" style="background: #f7f0f5;"></span>
            <span>Handle (Ken Stem)</span>
          </span>
          <input type="checkbox" id="toggle-handle" checked />
        </label>
      </div>

      <!-- Celestial Tama (Ball) -->
      <div class="panel-section">
        <h2 class="section-title">Celestial Tama (Ball)</h2>
        <label class="toggle-item">
          <span class="toggle-label-wrap">
            <span class="swatch" style="background: #fff9fc; box-shadow: 0 0 6px rgba(239, 185, 213, 0.8);"></span>
            <span>Tama (Celestial Ball)</span>
          </span>
          <input type="checkbox" id="toggle-tama" checked />
        </label>
      </div>

      <!-- Inspection Controls Guide -->
      <div class="hint-box">
        <strong>Mouse Navigation:</strong><br />
        • Left Click + Drag: Orbit / Rotate<br />
        • Mouse Wheel: Smooth Zoom<br />
        • Right Click + Drag: Pan
      </div>
    </div>

    <!-- Modular Application Script -->
    <script type="module" src="/src/preview/kendama-preview.js"></script>
  </body>
</html>
